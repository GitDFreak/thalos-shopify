name: Bug report
description: Something is broken or produces wrong results.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. **Never include your Shopify access tokens.**

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal command line + what you saw.
      placeholder: |
        1. Run `python -m thalos --sections products --dry-run`
        2. Observed: …
        3. Expected: …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: thalos-shopify version
      description: Output of `python -c "import thalos; print(thalos.__version__)"` (or commit hash if on main).
    validations:
      required: true

  - type: input
    id: api-version
    attributes:
      label: SHOPIFY_API_VERSION
      placeholder: "2026-01"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.13.0"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / stack trace
      description: Paste the first error and enough context to locate it. Redact store names and tokens.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I confirmed this is not already reported in existing issues.
          required: true
        - label: I removed all tokens and sensitive store data from this report.
          required: true
