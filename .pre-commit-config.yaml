# Pre-commit hooks. Install locally once:
#   pip install pre-commit && pre-commit install
# Runs on `git commit` — catches obvious mistakes before they land in history.
# The CI re-runs the same tooling on every push so this is optional.

repos:

  # Catch common Python mistakes (trailing whitespace, stray debug prints,
  # merge-conflict markers, huge accidentally-committed files).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key

  # Secret scan. Catches accidentally-committed API keys / tokens / private
  # keys before they hit a public branch.
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.82.13
    hooks:
      - id: trufflehog
        args: [--only-verified, --fail]

  # Python SAST.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: [-c, bandit.yaml, -r, .]
        pass_filenames: false
